name: Atualização diária e deploy

# Seg–sex 22h17 em Brasília = ter–sáb 01:17 UTC (o GitHub usa UTC).
# Minuto 17 para fugir do pico do início da hora, que atrasava a V1 em até 8 h.
on:
  schedule:
    - cron: "17 1 * * 2-6"
  # Cada merge na main publica o código novo na hora (sem coletar: usa o banco da release).
  push:
    branches: [main]
    paths: ["web/**", "pipeline/**", ".github/workflows/update_data.yml"]
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Só reexportar e publicar (sem coletar dados novos)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  DATA_RELEASE: data-latest

jobs:
  update:
    name: Coletar, exportar e construir
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # só para atualizar o arquivo do banco na release "data-latest"
    outputs:
      healthy: ${{ steps.health.outputs.healthy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependências do pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Restaurar banco (release data-latest; na 1ª vez, branch deploy da V1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download "$DATA_RELEASE" --pattern finance.db --dir data --clobber 2>/dev/null; then
            echo "Banco restaurado da release $DATA_RELEASE"
          elif git fetch --depth=1 origin deploy 2>/dev/null && git show FETCH_HEAD:data/finance.db > data/finance.db; then
            echo "Banco restaurado da branch deploy (V1)"
          else
            rm -f data/finance.db
            echo "::warning::Banco não encontrado; será criado do zero (400 dias de histórico)"
          fi

      - name: Pipeline (coleta com retry, limpeza, métricas, export JSON)
        run: |
          if [ "${{ inputs.skip_collect }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            python -m pipeline.run --skip-collect --no-health
          else
            python -m pipeline.run --no-health
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build do site estático
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

      - name: Guardar banco na release data-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$DATA_RELEASE" >/dev/null 2>&1; then
            gh release create "$DATA_RELEASE" --prerelease --title "Dados (automático)" \
              --notes "Banco SQLite do Radar Financeiro, substituído a cada execução do workflow. Não é uma versão do site."
          fi
          gh release upload "$DATA_RELEASE" data/finance.db --clobber

      - name: Cópia do banco (artefato, 30 dias)
        uses: actions/upload-artifact@v7
        with:
          name: finance-db-${{ github.run_id }}
          path: data/finance.db
          retention-days: 30

      - name: Saúde do pipeline
        id: health
        run: |
          if python -m pipeline.health; then echo "healthy=true" >> "$GITHUB_OUTPUT"; else echo "healthy=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    name: Publicar no GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Falha visível (e e-mail do GitHub) quando algum ativo ficou sem dado novo,
  # depois de publicar o que foi possível — o site mostra a data de cada dado.
  health:
    name: Saúde dos dados
    needs: [update, deploy]
    if: always() && needs.update.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar
        run: |
          if [ "${{ needs.update.outputs.healthy }}" != "true" ]; then
            echo "::error::Há ativos ou indicadores sem dado novo além do limite. Veja o passo 'Saúde do pipeline' do job anterior."
            exit 1
          fi
          echo "Todos os ativos e indicadores atualizados."
