name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (lint + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements-dev.txt
      - run: pip install -r pipeline/requirements-dev.txt
      - run: ruff check pipeline
      - run: python -m pytest pipeline -q

  web:
    name: Web (lint, typecheck, testes, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt

      # Dados reais do último dia (sem coletar): restaura o banco e só exporta.
      - name: Dados para o build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download data-latest --pattern finance.db --dir data --clobber \
            || { git fetch --depth=1 origin deploy && git show FETCH_HEAD:data/finance.db > data/finance.db; }
          python -m pipeline.run --skip-collect --no-health

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Testes unitários
        working-directory: web
        run: npm test
      - name: Build estático
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # O banco da V1 (fallback) pode estar alguns dias atrás; o deploy diário usa 7.
          RADAR_MAX_DATA_AGE_DAYS: "10"
        run: npm run build
      - name: Testes e2e (Playwright)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7
